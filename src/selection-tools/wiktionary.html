<!DOCTYPE html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="common.css" rel="stylesheet">
<base href="https://tr.wiktionary.org/wiki/Ana_Sayfa">
<style>
ul {
    margin: .5em 0;
    font-style: italic;
    opacity: .75;
    font-size: smaller;
    list-style: none;
}
h1 {
    padding-inline-end: 1em;
    display: inline;
}
hgroup p {
    font-size: smaller;
    display: inline;
}
</style>
<main></main>
<footer><p></footer>
<script>
let msgError, msgErrorAction
const main = document.querySelector('main')
const footer = document.querySelector('footer')

const translateToTurkish = text =>
    fetch('https://translate.googleapis.com/translate_a/single?client=gtx'
    + '&ie=UTF-8&oe=UTF-8&sl=auto&tl=tr&dt=t&q=' + encodeURIComponent(text))
        .then(res => res.ok ? res.json() : Promise.reject(new Error()))
        .then(json => json[0].map(x => x[0]).join(''))

// tr.wiktionary has no REST definition endpoint,
// so take the "Türkçe" section of the parsed page and keep only the definition lists
const wiktionary = word => {
    document.body.dataset.state = 'loading'
    return fetch('https://tr.wiktionary.org/w/api.php?action=parse&format=json'
    + '&formatversion=2&prop=text&disableeditsection=1&redirects=1&origin=*'
    + '&page=' + encodeURIComponent(word))
        .then(res => res.ok ? res.json() : Promise.reject(new Error()))
        .then(json => {
            if (json.error) throw new Error(json.error.info)
            const doc = new DOMParser().parseFromString(json.parse.text, 'text/html')
            const h2 = doc.getElementById('Türkçe')
            if (!h2) throw new Error('No Turkish section')
            const hgroup = document.createElement('hgroup')
            const h1 = document.createElement('h1')
            h1.innerText = word
            const p = document.createElement('p')
            p.innerText = 'Türkçe'
            hgroup.append(h1, p)
            const sections = []
            let heading
            for (let el = h2.closest('.mw-heading')?.nextElementSibling ?? h2.nextElementSibling;
                el && !el.classList.contains('mw-heading2') && el.tagName !== 'H2';
                el = el.nextElementSibling) {
                if (el.classList.contains('mw-heading')) heading = el.textContent
                else if (el.tagName === 'OL') {
                    if (heading) {
                        const h2 = document.createElement('h2')
                        h2.innerText = heading
                        sections.push(h2)
                        heading = null
                    }
                    sections.push(el)
                }
            }
            if (!sections.length) throw new Error('No definitions')
            main.append(hgroup, ...sections)
            document.querySelector('#link').href = '/wiki/' + word
            document.body.dataset.state = 'loaded'
        })
        .catch(e => {
            console.error(e)
            const lower = word.toLocaleLowerCase('tr')
            if (lower !== word) return wiktionary(lower)
            else {
                const div = document.createElement('div')
                const h1 = document.createElement('h1')
                h1.innerText = msgError
                const p = document.createElement('p')
                p.innerHTML = `<a href="https://tr.wiktionary.org/w/index.php?search=${encodeURIComponent(word)}">${msgErrorAction}</a>`
                div.append(h1, p)
                main.append(div)
                document.body.dataset.state = 'error'
            }
        })
}

main.addEventListener('click', e => {
    const { target } = e
    if (target.tagName === 'A') {
        const href = target.getAttribute('href')
        if (href.startsWith('/wiki/')) {
            const [word] = decodeURIComponent(href.replace('/wiki/', '')).split('#')
            // skip namespaced pages (Vikisözlük:, Ek:, Kategori:, ...)
            if (!word.includes(':')) {
                e.preventDefault()
                main.replaceChildren()
                wiktionary(word.replaceAll('_', ' '))
            }
        }
    }
})

globalThis.init = ({ msg, text, lang }) => {
    document.querySelector('footer').innerHTML = msg.footer
    msgError = msg.error
    msgErrorAction = msg.errorAction
    translateToTurkish(text)
        .catch(e => (console.error(e), text))
        .then(word => wiktionary(word.trim()))
}
</script>
